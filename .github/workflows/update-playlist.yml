name: Update PlayZ TV Playlist

on:
  schedule:
    # Run at minute 0 of every hour — UTC time
    # Bangladesh time (UTC+6): runs at 6:00, 7:00, 8:00, ...
    - cron: '0 * * * *'
  workflow_dispatch:    # Allow manual trigger from Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/update-playlist.yml'

# Permissions for the auto-generated GITHUB_TOKEN
# (No PAT needed — this token is auto-injected by GitHub Actions)
permissions:
  contents: write      # Required to commit updated playlists back to repo

concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run playlist updater
        run: |
          python scripts/playztv_auto_update.py

      - name: Show generated files
        run: |
          echo "=== Generated files ==="
          ls -lah output/
          echo ""
          echo "=== status.json ==="
          cat output/status.json

      - name: Commit & push updated playlists
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all output files
          git add output/

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            # Commit with timestamp
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore: auto-update playlist — ${TIMESTAMP}

            Generated by GitHub Actions hourly cron.
            See output/status.json for verification stats."

            # Push back to main
            git push
            echo "✓ Pushed updated playlist"
          fi

      - name: Cleanup old workflow runs (keep last 30)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo,
              workflow_id: 'update-playlist.yml',
              per_page: 100
            });
            const oldRuns = runs.data.workflow_runs
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(30);
            for (const run of oldRuns) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                console.log(`Deleted run ${run.id}`);
              } catch (e) {
                console.log(`Skip ${run.id}: ${e.message}`);
              }
            }
